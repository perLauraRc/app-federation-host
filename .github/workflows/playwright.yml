name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # Checkout (clone) the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Install and set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Install NPM dependencies
      - name: Install NPM dependencies
        run: npm ci

      # Install Playwright Browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Output ENVIRONMENT VARIABLES for debugging
      - name: Output Environment Variables
        run: printenv

      # Add app-federation as a hostname to /etc/hosts
      - name: Add app-federation to /etc/hosts
        run: echo "127.0.0.1 app-federation" | sudo tee -a /etc/hosts

      # Ensure the app server is started and ready before running Playwright tests
      # - name: Start dev server (CI)
      #   run: |
      #     npm ci
      #     npm run dev -- --host 0.0.0.0 &   # make server reachable in runner
      #     npx wait-on http://localhost:5173
      #   timeout-minutes: 5

      # Add a verification/debug step to confirm CI HTML before running Playwright tests
      - name: Debug - Show server response
        run: |
          echo "HEADERS:"
          curl -I http://localhost:5173 || true
          echo "HTML (first 500 lines):"
          curl http://localhost:5173 | sed -n '1,500p'

      # Run Playwright tests
      - name: Run Playwright tests
        run: npx playwright test

      # Upload HTML report to the GitHub UI
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
